name: ASZTAL V1 ellenorzes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build cloud client
        run: npm run build
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Test Safari bookmark parser
        run: node tests/safari-import.test.cjs
      - name: Check required files
        run: test -s index.html && test -s styles.css && test -s manifest.webmanifest && test -s icon.svg
